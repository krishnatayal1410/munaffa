name: Munaffa Live Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://munaffa-krishnatayal1410s-projects.vercel.app
    steps:
      - name: Wait for production health
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 24); do
            code=$(curl -L --silent --show-error --max-time 20 -o /tmp/health.json -w "%{http_code}" "$BASE_URL/api/health" || true)
            echo "Attempt $attempt: HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.json && grep -q '"service":"munaffa-web"' /tmp/health.json; then
              exit 0
            fi
            sleep 15
          done
          echo "Production health did not become ready in time."
          exit 1

      - name: Verify public routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /product /pricing /demo /auth/sign-up; do
            code=$(curl -L --silent --show-error --max-time 25 -o /tmp/page.html -w "%{http_code}" "$BASE_URL$route")
            echo "$route -> HTTP $code"
            test "$code" = "200"
          done
